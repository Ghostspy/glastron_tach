[platformio]
default_envs = tach
src_dir = main
; Isolate the pinned tools from older ESP-IDF installations on this computer.
core_dir = .pio/core

[env:tach]
platform = platformio/espressif32@6.11.0
framework = espidf
board = waveshare_esp32_s3_touch_lcd_2_8c

; Keep the ESP-IDF release used to validate the display firmware.
; ESP32 component requirements are also declared in main/idf_component.yml.
; LVGL 8.3.11 is vendored in components/lvgl; do not add a second lib_deps copy.
; The package adapter installs Espressif's complete 5.4.4 release.
platform_packages =
    framework-espidf @ file://scripts/espidf
    platformio/toolchain-xtensa-esp-elf @ 14.2.0+20260121
    platformio/toolchain-riscv32-esp @ 14.2.0+20260121
    platformio/tool-esptoolpy @ ~2.41100.0

board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DBOAT_PLATFORMIO=ON
extra_scripts =
    pre:scripts/platformio_setup.py
    post:scripts/platformio_memory.py
build_type = debug
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Ports are detected automatically. Set these only if you have multiple boards.
; upload_port = /dev/cu.YOUR_PORT
; monitor_port = /dev/cu.YOUR_PORT
